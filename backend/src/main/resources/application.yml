spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:tutorlink;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  h2.console.enabled: true
server.error.include-message: never
app:
  jwt-secret: ${JWT_SECRET:change-this-development-only-secret-key-to-a-long-random-value-123456}
  jwt-expiration-ms: 86400000
